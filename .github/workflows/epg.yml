name: Actualizar EPG Slovenia

on:
  schedule:
    # Cada 6 horas (UTC). Ajusta a tu gusto: https://crontab.guru/
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write   # necesario para poder hacer commit/push del epg.xml

jobs:
  build-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper
        run: python EPGSLOVENIA.py --canal sk1 sporttv1 --dias 7 --salida epg.xml

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml
          if git diff --cached --quiet; then
            echo "Sin cambios en epg.xml"
          else
            git commit -m "Actualizar EPG [skip ci]"
            git push
          fi
